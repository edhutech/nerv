name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify Trusted Publishing prerequisites
        run: |
          node -e 'const meetsMinimum = (actual, minimum) => { for (let index = 0; index < minimum.length; index += 1) { if (actual[index] !== minimum[index]) return actual[index] > minimum[index]; } return true; }; const actual = process.versions.node.split(".").map(Number); if (!meetsMinimum(actual, [22, 14, 0])) throw new Error(`Node ${process.versions.node} is below 22.14.0`);'
          node -e 'const meetsMinimum = (actual, minimum) => { for (let index = 0; index < minimum.length; index += 1) { if (actual[index] !== minimum[index]) return actual[index] > minimum[index]; } return true; }; const actual = process.argv[1].split(".").map(Number); if (!meetsMinimum(actual, [11, 5, 1])) throw new Error(`npm ${process.argv[1]} is below 11.5.1`);' "$(npm --version)"
          node -e 'const pkg = require("./package.json"); if (pkg.repository?.url !== "git+https://github.com/edhutech/nerv.git") throw new Error("package repository metadata must identify edhutech/nerv"); if (pkg.publishConfig?.registry !== "https://registry.npmjs.org") throw new Error("npmjs.com must be the publish registry");'
          test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#v}"
      - run: pnpm validate
      - run: pnpm test:package
      - run: npm publish --provenance --tag alpha
